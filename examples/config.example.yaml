# atomicmath lineage config
#
# The only required dataset columns are question and answer. Change the field
# names below for any Hugging Face dataset with a different schema.

input:
  dataset: "ShadenA/MathNet"
  config_name: "United_States"
  split: "train"
  question_field: "problem_markdown"
  answer_field: "final_answer"
  iteration_field: "iteration"
  memory_field: "memory"
  max_seeds: 100
  seed: 42

output:
  # If this is the same as input.dataset, generated questions are appended to
  # the original dataset before upload. If it differs, only generated rows are
  # uploaded to the new dataset.
  dataset: "vibhuiitj/atomicmath-lineage"
  split: "train"
  private: false
  push_to_hub: false
  append_if_same_dataset: true
  local_path: "./out/lineage/atomicmath_lineage.jsonl"
  summary_path: "./out/lineage/atomicmath_lineage_summary.json"

models:
  generator: "openai/gpt-5-mini"
  refiner: "openai/gpt-5-mini"
  judge: "openai/gpt-5-mini"

lineage:
  candidates_per_iteration: 3
  generator_temperature: 0.8
  refiner_temperature: 0.4
  judge_temperature: 0.0
  max_memory_items: 8
  min_novelty: 0.45
  min_depth: 0.45
  min_non_stitched: 0.70
  min_solution_economy: 0.50
  continue_on_rejected: false

storage:
  cache_dir: "./cache"

runtime:
  dry_run: false
  log_level: "INFO"
