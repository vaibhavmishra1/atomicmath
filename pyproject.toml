[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "atomicmath"
version = "0.0.1"
description = "Lineage pipeline for iterative synthesis of new math problems from solved seed problems."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "atomicmath" }]
dependencies = [
    "datasets>=2.20",
    "huggingface_hub>=0.24",
    "litellm>=1.50",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "rich>=13.7",
    "tenacity>=8.5",
]

[project.scripts]
atomicmath = "atomicmath.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["atomicmath"]
